# Uncomment the following lines to enable RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to turn on logging, and set ZMK logging to debug output
# CONFIG_ZMK_USB_LOGGING=y

# Settings storage (needed for BLE bonds, Studio, etc.)
CONFIG_SETTINGS=y

# Enable Bluetooth and ZMK's BLE transport
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y          # needed because the left is central for the split
CONFIG_BT_SETTINGS=y

# Macro Queue size
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=256